[package]
name = "nodus"
version = "0.4.2"
edition = "2024"
rust-version = "1.91"
description = "Native local-first Markdown notes with encrypted P2P sync"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_commonmark = "0.25"
egui_extras = { version = "0.36", features = ["file", "image"] }
filetime = "0.2"
hostname = "0.4"
iroh = "1.2"
iroh-tickets = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync", "time"] }
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
